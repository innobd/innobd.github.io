# Pages CMS 설정 (app.pagescms.org)
# GitHub로 로그인하면 아래 항목들이 Google Sites처럼 입력 폼으로 나타납니다.
# 저장을 누르면 GitHub에 커밋되고 몇 분 뒤 사이트에 반영됩니다.

media:
  input: public/images
  output: /images
  categories: [image]

components:
  text_ko_en:
    type: object
    fields:
      - name: ko
        label: 한국어
        type: string
      - name: en
        label: English
        type: string
  para_ko_en:
    type: object
    fields:
      - name: ko
        label: 한국어
        type: text
      - name: en
        label: English
        type: text

content:
  - name: carousel
    label: 홈 화면 상단 슬라이드
    type: file
    path: src/data/carousel.json
    format: json
    list: true
    fields:
      - name: image
        label: 사진
        type: image
        required: true
      - name: caption
        label: 문구 (선택, 사진 위에 덧붙일 제목)
        component: text_ko_en
      - name: link
        label: 클릭 시 이동할 링크 (선택, 예 /news 또는 /research)
        type: string
      - name: id
        label: 고유 ID (영문 소문자, 예 research-overview)
        type: string
        required: true

  - name: news
    label: 소식
    type: file
    path: src/data/news.json
    format: json
    list: true
    fields:
      - name: date
        label: 날짜
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: datePrecision
        label: 날짜 표시 범위
        type: select
        options:
          values:
            - { name: year, label: 연도만 표시 }
            - { name: day, label: 연월일 표시 }
      - name: type
        label: 종류
        type: select
        options:
          values:
            - { name: grant, label: 과제 선정 }
            - { name: honor, label: 수상 / 위촉 }
            - { name: talk, label: 학회 발표 }
            - { name: paper, label: 논문 게재 }
            - { name: news, label: 일반 소식 }
      - name: text
        label: 제목 (신문기사 제목처럼 짧고 간결하게)
        component: para_ko_en
      - name: detail
        label: 추가 설명 (선택, 제목 아래 작은 글씨로 1~2줄)
        component: para_ko_en
      - name: link
        label: 관련 링크 (선택)
        type: string
      - name: images
        label: 사진 (여러 장 가능, 드래그로 순서 변경)
        type: image
        list: true
      - name: id
        label: 고유 ID (선택, 영문 소문자와 하이픈)
        type: string

  - name: members
    label: 구성원
    type: file
    path: src/data/members.json
    format: json
    list: true
    fields:
      - name: name
        label: 이름
        component: text_ko_en
      - name: role
        label: 구분
        type: select
        options:
          values:
            - { name: pi, label: 연구책임자 }
            - { name: postdoc, label: 박사후연구원 }
            - { name: phd, label: 박사과정 }
            - { name: ms, label: 석사과정 }
            - { name: undergrad, label: 학부연구생 }
            - { name: intern, label: "인턴수료생" }
            - { name: alumni, label: "졸업생" }
      - name: title
        label: 직함 표시
        component: text_ko_en
      - name: affiliation
        label: "소속 (선택, 학부연구생 등 제목 아래에 괄호로 표시)"
        component: text_ko_en
      - name: research
    label: 연구 페이지
    type: file
    path: src/data/research.json
    format: json
    fields:
      - name: why
        label: "1. Why DDS Research in InnoBD"
        type: object
        fields:
          - { name: title, label: 제목 (영문 그대로 표시), type: string }
          - name: subtitle
            label: 부제
            component: text_ko_en
          - name: paragraphs
            label: 본문 (문단별로 추가)
            component: para_ko_en
            list: true
      - name: questions
        label: "2. Research Questions"
        type: object
        fields:
          - { name: title, label: 제목 (영문 그대로 표시), type: string }
          - name: items
            label: 연구 질문 (순서대로 1, 2, 3 번호가 붙습니다)
            type: object
            list:
              collapsible:
                summary: "{q.ko}"
            fields:
              - { name: id, label: 고유 ID (영문 소문자, 예 q1), type: string, required: true }
              - name: q
                label: 질문
                component: text_ko_en
              - name: paragraphs
                label: 본문 (문단별로 추가)
                component: para_ko_en
                list: true
              - name: takeaway
                label: 한 줄 정리 (굵게 표시)
                component: para_ko_en
              - name: refs
                label: 관련 연구 (아래 "참고 논문"의 고유 ID, 예 ajps)
                type: string
                list: true
      - name: approach
        label: "3. Our Approach & Aim"
        type: object
        fields:
          - { name: title, label: 제목 (영문 그대로 표시), type: string }
          - name: subtitle
            label: 부제
            component: text_ko_en
          - name: intro
            label: 도입 문단
            component: para_ko_en
          - name: items
            label: 접근 방법 (순서대로 번호가 붙습니다)
            type: object
            list:
              collapsible:
                summary: "{title.ko}"
            fields:
              - name: title
                label: 제목
                component: text_ko_en
              - name: body
                label: 설명
                component: para_ko_en
          - name: closing
            label: 맺음말
            type: object
            fields:
              - name: title
                label: 제목
                component: text_ko_en
              - name: paragraphs
                label: 본문 (문단별로 추가)
                component: para_ko_en
                list: true
              - name: final
                label: 마지막 한 줄 (굵게 표시)
                component: para_ko_en
      - name: references
        label: 참고 논문 (연구 질문 아래 "관련 연구"로 링크됩니다)
        type: object
        list:
          collapsible:
            summary: "{id}"
        fields:
          - { name: id, label: 고유 ID (영문 소문자, 질문의 "관련 연구"에서 사용), type: string, required: true }
          - { name: title, label: 논문 제목, type: string }
          - { name: journal, label: 저널, type: string }
          - { name: year, label: 연도, type: string }
          - { name: doi, label: DOI (10.xxxx/... 부분만), type: string }

  - name: collaborators
    label: 공동연구기관
    type: file
    path: src/data/collaborators.json
    format: json
    list: true
    fields:
      - name: institution
        label: 기관명
        component: text_ko_en
      - name: country
        label: 국가
        component: text_ko_en
      - name: people
        label: 담당 교수 (쉼표 구분)
        type: string
      - name: note
        label: 협력 내용 (선택)
        component: para_ko_en
      - name: id
        label: 고유 ID (영문 소문자)
        type: string
        required: true

  - name: lab
    label: 연구실 기본정보
    type: file
    path: src/data/lab.json
    format: json
    fields:
      - name: shortName
        label: 짧은 이름 (헤더 표시)
        type: string
      - name: name
        label: 연구실 정식 명칭
        component: text_ko_en
      - name: pi
        label: 연구책임자
        component: text_ko_en
      - name: affiliation
        label: 소속
        component: text_ko_en
      - name: address
        label: 주소
        component: para_ko_en
      - name: email
        label: 대표 이메일
        type: string
      - name: phone
        label: 전화
        type: string
      - name: hero
        label: 홈 화면 문구
        type: object
        fields:
          - name: headline
            label: 큰 제목
            component: para_ko_en
          - name: sub
            label: 소개 문장
            component: para_ko_en
      - name: links
        label: 외부 링크
        type: object
        fields:
          - { name: scholar, label: Google Scholar, type: string }
          - { name: orcid, label: ORCID, type: string }
          - { name: github, label: GitHub, type: string }
          - { name: linkedin, label: LinkedIn, type: string }

  - name: join
    label: 모집 안내
    type: file
    path: src/data/join.json
    format: json
    fields:
      - name: intro
        label: 소개 문장
        component: para_ko_en
      - name: positions
        label: 모집 구분
        type: object
        list:
          collapsible:
            summary: "{title.ko}"
        fields:
          - name: id
            label: 고유 ID
            type: string
          - name: title
            label: 제목
            component: text_ko_en
          - name: text
            label: 내용
            component: para_ko_en
      - name: howToApply
        label: 지원 방법
        component: para_ko_en

