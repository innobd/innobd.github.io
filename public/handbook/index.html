<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>InnoBD Lab Handbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500&family=IBM+Plex+Mono&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: single reading column, quiet header with language toggle, documents as plain pages */
:root {
  --bg: #fbfaf7;
  --fg: #1f2a33;
  --muted: #5d6b76;
  --line: #d9dfe3;
  --surface: #ffffff;
  --accent: #0d5c63;
  --accent-soft: #e3f0f0;
  --warn: #8a4b1a;
  --warn-soft: #f7ebdd;
  --font-body: 'Noto Sans KR', 'IBM Plex Sans', 'Malgun Gothic', Arial, sans-serif;
  --font-display: 'IBM Plex Serif', 'Noto Serif KR', Georgia, serif;
  --font-mono: 'IBM Plex Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191d; --fg: #e6e9eb; --muted: #9ba7b0; --line: #2f3940; --surface: #1d2328;
    --accent: #7fc4c8; --accent-soft: #1d3335; --warn: #e2a56a; --warn-soft: #3a2a1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191d; --fg: #e6e9eb; --muted: #9ba7b0; --line: #2f3940; --surface: #1d2328;
  --accent: #7fc4c8; --accent-soft: #1d3335; --warn: #e2a56a; --warn-soft: #3a2a1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
html[data-lang="en"] [lang="ko"] { display: none !important; }
html[data-lang="ko"] [lang="en"] { display: none !important; }
html:not([data-lang]) [lang="en"] { display: none !important; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 14px; border-bottom: 1px solid var(--line); margin-bottom: 32px; flex-wrap: wrap;
}
.brand { font-family: var(--font-display); font-size: 17px; color: var(--fg); text-decoration: none; letter-spacing: 0.01em; }
.brand small { color: var(--muted); font-family: var(--font-body); font-size: 12px; margin-left: 8px; }
.lang {
  display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface);
}
.lang button {
  border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; letter-spacing: 0.06em;
  padding: 5px 12px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
h1 { font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.25; margin: 0 0 8px; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 40px 0 10px; text-wrap: balance; }
h3 { font-size: 16px; font-weight: 700; margin: 24px 0 6px; }
p { margin: 0 0 14px; }
.lead { color: var(--muted); font-size: 16px; margin-bottom: 20px; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
.eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
ul, ol { padding-left: 22px; margin: 0 0 14px; }
li { margin-bottom: 4px; }
code { font-family: var(--font-mono); font-size: 14px; background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }
.tree { font-family: var(--font-mono); font-size: 14px; line-height: 1.6; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px; overflow-x: auto; white-space: pre; margin: 0 0 16px; }
.pair { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 0 0 16px; }
@media (min-width: 560px) { .pair { grid-template-columns: 1fr 1fr; } }
.pair > div { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; background: var(--surface); min-width: 0; }
.pair .no { border-color: var(--warn); }
.pair .ok { border-color: var(--accent); }
.pair .tag { font-size: 11px; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 6px; }
.pair .no .tag { color: var(--warn); }
.pair .ok .tag { color: var(--accent); }
.pair ul { margin: 0; padding-left: 18px; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; margin: 0 0 16px; font-size: 15px; }
.rule { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; margin: 0 0 16px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 0 0 16px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.source { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.source a { word-break: break-all; }
.docnav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; font-size: 14px; flex-wrap: wrap; }
.toc { list-style: none; padding: 0; margin: 0 0 8px; }
.toc li { margin: 0; border-top: 1px solid var(--line); }
.toc li:last-child { border-bottom: 1px solid var(--line); }
.toc a { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 4px; color: var(--fg); text-decoration: none; }
.toc a:hover .t { color: var(--accent); text-decoration: underline; }
.toc .n { font-family: var(--font-mono); font-size: 13px; color: var(--muted); padding-top: 3px; }
.toc .t { font-weight: 700; }
.toc .d { font-size: 14px; color: var(--muted); }
.soon { color: var(--muted); font-size: 14px; padding: 12px 4px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.soon ul { margin-top: 8px; }
.pill { display: inline-block; font-size: 11px; letter-spacing: 0.08em; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); margin-left: 6px; vertical-align: middle; }
.lock { max-width: 420px; margin: 48px auto 0; }
.lock p { color: var(--muted); font-size: 15px; }
.lock form { display: flex; gap: 8px; flex-wrap: wrap; }
.lock input { flex: 1 1 180px; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.lock button { font: inherit; font-size: 15px; padding: 10px 18px; border: 0; border-radius: 6px; background: var(--accent); color: var(--bg); cursor: pointer; }
.lock button[disabled] { opacity: 0.6; cursor: default; }
.err { color: var(--warn); font-size: 14px; min-height: 1.4em; margin-top: 8px; }
.lockout { margin-left: auto; font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="#home">InnoBD Lab Handbook <small lang="ko">연구실 안내서</small></a>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="ko" aria-pressed="true">한국어</button><button type="button" data-lang="en" aria-pressed="false">English</button></div>
    <button type="button" class="lockout" id="lockout" hidden><span lang="ko">잠그기</span><span lang="en">Lock</span></button>
  </div>
</header>

<div class="lock" id="lock">
  <h1 lang="ko">연구실 구성원 전용</h1>
  <h1 lang="en">Lab members only</h1>
  <p lang="ko">이 페이지의 내용은 암호화되어 있습니다. 연구실에서 안내받은 비밀번호를 입력하세요.</p>
  <p lang="en">The content of this page is encrypted. Enter the password given to lab members.</p>
  <form id="form" autocomplete="off">
    <label for="pw" style="position:absolute;left:-9999px">Password</label>
    <input type="password" id="pw" inputmode="numeric" placeholder="비밀번호 / Password" required>
    <button type="submit" id="go"><span lang="ko">열기</span><span lang="en">Open</span></button>
  </form>
  <div class="err" id="err"></div>
</div>

<main id="content" hidden></main>
</div>

<script>
(function () {
  var BLOB = null;
  async function loadBlob() { if (!BLOB) { var r = await fetch('payload.json', { cache: 'no-store' }); BLOB = await r.json(); } }
  var root = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem('innobd-lang'); } catch (e) {}
  function applyLang(l) {
    root.setAttribute('data-lang', l);
    try { localStorage.setItem('innobd-lang', l); } catch (e) {}
    var btns = document.querySelectorAll('.lang button');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-lang') === l ? 'true' : 'false');
  }
  applyLang(saved === 'en' ? 'en' : 'ko');
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('.lang button');
    if (b) applyLang(b.getAttribute('data-lang'));
  });

  var pages = null, titles = null;
  var content = document.getElementById('content');
  var lock = document.getElementById('lock');
  var err = document.getElementById('err');
  var form = document.getElementById('form');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var lockout = document.getElementById('lockout');

  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

  async function decrypt(password) {
    await loadBlob();
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(BLOB.salt), iterations: BLOB.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BLOB.nonce) }, key, b64(BLOB.data));
    var ds = new DecompressionStream('gzip');
    var text = await new Response(new Blob([plain]).stream().pipeThrough(ds)).text();
    return JSON.parse(text);
  }

  function render() {
    if (!pages) return;
    var id = (location.hash || '#home').slice(1);
    if (!pages[id]) id = 'home';
    content.innerHTML = pages[id];
    document.title = id === 'home' ? titles.home : titles[id] + ' | InnoBD Lab Handbook';
    window.scrollTo(0, 0);
  }

  function unlock(data) {
    pages = data.pages; titles = data.titles;
    lock.hidden = true; content.hidden = false; lockout.hidden = false;
    render();
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    err.textContent = '';
    go.disabled = true;
    try {
      var data = await decrypt(pw.value);
      try { sessionStorage.setItem('innobd-hb-pw', pw.value); } catch (e) {}
      unlock(data);
    } catch (e) {
      err.textContent = root.getAttribute('data-lang') === 'en' ? 'Wrong password. Please try again.' : '비밀번호가 맞지 않습니다. 다시 입력해 주세요.';
      pw.select();
    }
    go.disabled = false;
  });

  lockout.addEventListener('click', function () {
    try { sessionStorage.removeItem('innobd-hb-pw'); } catch (e) {}
    pages = null; content.innerHTML = ''; content.hidden = true; lockout.hidden = true; lock.hidden = false; pw.value = '';
    location.hash = '';
  });

  window.addEventListener('hashchange', render);

  (async function () {
    var s = null;
    try { s = sessionStorage.getItem('innobd-hb-pw'); } catch (e) {}
    if (s) { try { unlock(await decrypt(s)); } catch (e) {} }
  })();
})();
</script>
</body>
</html>
